<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlanceApp 93 - Cloud Briefings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div class="max-w-md mx-auto p-4 flex flex-col gap-4">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div>
        <h1 class="text-xl font-bold text-indigo-400">GlanceApp 93</h1>
        <p class="text-xs text-slate-400">Mobile Cloud Briefings Engine</p>
      </div>
      <span class="inline-flex items-center px-2 py-1 text-xs font-semibold text-emerald-400 bg-emerald-950 border border-emerald-800 rounded-full">
        ● LIVE DEMO
      </span>
    </header>

    <!-- Controls / Feedback Loop -->
    <section class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 text-xs">
      <div class="flex justify-between items-center mb-2">
        <span class="font-semibold text-slate-300">Operator Feedback Controls</span>
        <button onclick="triggerSimulate()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded transition">⚡ Ingest Stream Batch</button>
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-slate-400 mb-1">Severity Wt</label>
          <input type="range" id="wSev" min="0" max="1" step="0.1" value="0.5" onchange="adjustWeights()" class="w-full">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Impact Wt</label>
          <input type="range" id="wImp" min="0" max="1" step="0.1" value="0.3" onchange="adjustWeights()" class="w-full">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Latency Wt</label>
          <input type="range" id="wLat" min="0" max="1" step="0.1" value="0.2" onchange="adjustWeights()" class="w-full">
        </div>
      </div>
    </section>

    <!-- Prioritized Feed -->
    <main>
      <h2 class="text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Prioritized Incident Briefings</h2>
      <div id="briefingsList" class="flex flex-col gap-3">
        <div class="p-4 bg-slate-800 rounded border border-slate-700 text-center text-slate-400 text-sm">
          Loading briefings...
        </div>
      </div>
    </main>

    <!-- Audit Logs Drawer -->
    <section class="mt-4 border-t border-slate-800 pt-3">
      <h3 class="text-xs font-semibold text-slate-400 mb-2">Audit Trail</h3>
      <div id="auditLogs" class="bg-black/50 p-2 rounded text-[10px] font-mono text-slate-400 max-h-28 overflow-y-auto">
        Loading logs...
      </div>
    </section>

  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/briefings');
        const data = await res.json();
        renderBriefings(data.events || []);
        loadAuditLogs();
      } catch (err) {
        document.getElementById('briefingsList').innerHTML = `<div class="p-3 bg-red-900/40 border border-red-700 text-red-200 rounded text-xs">Failed to connect to backend.</div>`;
      }
    }

    function renderBriefings(events) {
      const container = document.getElementById('briefingsList');
      if (!events.length) {
        container.innerHTML = `<div class="p-4 bg-slate-800 rounded border border-slate-700 text-center text-slate-400 text-sm">No incidents reported. Click "Ingest Stream Batch" to simulate streams.</div>`;
        return;
      }

      container.innerHTML = events.map((item, idx) => {
        const isCritical = item.score > 8;
        const badgeColor = isCritical ? 'bg-red-950 text-red-400 border-red-800' : 'bg-amber-950 text-amber-400 border-amber-800';
        
        return `
          <div class="bg-slate-800/90 border border-slate-700 rounded-lg p-3 shadow-sm flex flex-col gap-2">
            <div class="flex justify-between items-start">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2 py-0.5 rounded border ${badgeColor}">
                  #${idx + 1} Score ${item.score}
                </span>
                <span class="text-xs font-semibold text-slate-300 uppercase">${item.source}</span>
              </div>
              <span class="text-[10px] text-slate-500">${new Date(item.ingestedAt).toLocaleTimeString()}</span>
            </div>
            
            <div class="text-sm font-medium text-slate-100">${item.type}</div>
            
            <div class="bg-indigo-950/50 border border-indigo-900/60 p-2 rounded text-xs text-indigo-200 leading-snug">
              🤖 ${item.aiExplanation}
            </div>

            <div class="flex justify-between text-[10px] text-slate-400 mt-1 border-t border-slate-700/50 pt-1">
              <span>Sev: ${item.severity}/10</span>
              <span>Impact: ${item.impactScore}/10</span>
              <span>Latency: ${item.latencyMs}ms</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function adjustWeights() {
      const wSev = parseFloat(document.getElementById('wSev').value);
      const wImp = parseFloat(document.getElementById('wImp').value);
      const wLat = parseFloat(document.getElementById('wLat').value);

      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ weightAdjustments: { severity: wSev, impact: wImp, latency: wLat } })
      });
      const data = await res.json();
      renderBriefings(data.events);
      loadAuditLogs();
    }

    async function triggerSimulate() {
      await fetch('/api/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([
          { source: "prod-db-us-east", type: "Replication Lag High", severity: 9, impactScore: 9, latencyMs: 450, payload: { lagSec: 42 } },
          { source: "k8s-ingress-eu", type: "504 Gateway Timeout Spikes", severity: 7, impactScore: 8, latencyMs: 1200, payload: { rate: "12%" } },
          { source: "auth-service-asia", type: "Token Verification Delay", severity: 4, impactScore: 5, latencyMs: 890, payload: { queue: 140 } }
        ])
      });
      loadData();
    }

    async function loadAuditLogs() {
      const res = await fetch('/api/audit');
      const data = await res.json();
      document.getElementById('auditLogs').innerHTML = data.logs.map(l => `<div>${l}</div>`).join('') || 'No logs yet.';
    }

    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
